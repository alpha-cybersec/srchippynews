name: CTI Chippy News RSS

on:
  workflow_dispatch:

  schedule:
    - cron: '7,37 * * * *'
      timezone: "America/Guayaquil"

permissions:
  contents: write

concurrency:
  group: cti-chippy-news-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger information
        run: |
          echo "=========================================="
          echo "TRIGGER INFORMATION"
          echo "=========================================="
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo ""
          echo "Hora UTC:"
          date -u
          echo ""
          echo "Hora Ecuador:"
          TZ=America/Guayaquil date
          echo "=========================================="

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all collectors
        run: |
          python run_all.py

      - name: Show allnews
        run: |
          echo "=========================================="
          echo "ALLNEWS DE ESTA CORRIDA"
          echo "=========================================="
          cat data/allnews.json

      - name: Save state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Update CTI Chippy News"
            git push
          fi
