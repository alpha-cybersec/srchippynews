name: CTI Schedule Probe

on:
  workflow_dispatch:

  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar evento programado
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC:"
          date -u
          echo "Ecuador:"
          TZ=America/Guayaquil date
