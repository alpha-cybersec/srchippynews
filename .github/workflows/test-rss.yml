name: Test CTI RSS Feeds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test-rss:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # GBHACKERS
      # =====================================================

      - name: Collect GBHackers RSS
        run: |
          python collector.py

      - name: Show GBHackers JSON
        run: |
          echo "=========================================="
          echo "GBHACKERS"
          echo "=========================================="
          cat data/gbhackers.json

      # =====================================================
      # CYBERSECURITYNEWS
      # =====================================================

      - name: Collect CyberSecurityNews RSS
        run: |
          python collector_cybersecuritynews.py

      - name: Show CyberSecurityNews JSON
        run: |
          echo "=========================================="
          echo "CYBERSECURITYNEWS"
          echo "=========================================="
          cat data/cybersecuritynews.json

      # =====================================================
      # GUARDAR RESULTADOS
      # =====================================================

      - name: Save RSS JSON files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gbhackers.json
          git add data/cybersecuritynews.json

          if git diff --cached --quiet; then
            echo "No hay cambios en los feeds."
          else
            git commit -m "Update CTI RSS feeds"
            git push
          fi
